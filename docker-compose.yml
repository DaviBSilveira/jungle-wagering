services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - wager-pg:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WORKERS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wager-pg:
